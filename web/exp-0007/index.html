<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>APRL EXP-0007</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #1d2433; background: #f4f2ed; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { width: min(920px, calc(100% - 32px)); margin: 0 auto; padding: 48px 0 72px; }
    header, section { background: #fff; border: 1px solid #dedbd3; border-radius: 16px; padding: clamp(20px, 4vw, 40px); margin-bottom: 16px; }
    .eyebrow { color: #6d5c3d; font-size: .8rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
    h1 { font-size: clamp(1.7rem, 4vw, 2.5rem); margin: .4rem 0 1rem; line-height: 1.25; }
    h2 { font-size: 1.15rem; margin: 0 0 16px; }
    p { line-height: 1.75; }
    .muted { color: #626876; font-size: .92rem; }
    .question { padding: 18px 20px; background: #f7f4ec; border-left: 4px solid #9c7b3f; border-radius: 8px; font-weight: 650; }
    .choices { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin: 24px 0; }
    .choice { display: block; position: relative; }
    .choice input { position: absolute; opacity: 0; pointer-events: none; }
    .choice-card { min-height: 190px; display: flex; flex-direction: column; justify-content: space-between; gap: 20px; border: 2px solid #d9d5cc; border-radius: 14px; padding: 22px; cursor: pointer; transition: border-color .15s, box-shadow .15s, transform .15s; }
    .choice-card:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(43, 38, 28, .08); }
    .choice input:focus-visible + .choice-card { outline: 3px solid #8ab4f8; outline-offset: 2px; }
    .choice input:checked + .choice-card { border-color: #755b2d; background: #fffaf0; box-shadow: 0 0 0 3px rgba(156, 123, 63, .16); }
    .choice-label { color: #755b2d; font-size: .82rem; font-weight: 750; }
    label.field { display: block; font-weight: 650; margin-top: 20px; }
    textarea { width: 100%; min-height: 110px; margin-top: 8px; padding: 12px; border: 1px solid #b9b6af; border-radius: 8px; font: inherit; resize: vertical; }
    button { border: 0; border-radius: 999px; padding: 12px 20px; font: inherit; font-weight: 700; cursor: pointer; }
    button.primary { background: #263248; color: #fff; }
    button.secondary { color: #263248; background: #e9edf3; }
    button.danger { color: #8d2424; background: #f8e9e9; }
    button:disabled { opacity: .45; cursor: not-allowed; }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 24px; }
    .status { min-height: 1.5em; color: #44624a; font-weight: 650; }
    .hidden { display: none; }
    .count { font-variant-numeric: tabular-nums; }
    @media (max-width: 680px) { .choices { grid-template-columns: 1fr; } main { padding-top: 20px; } }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="eyebrow">AI Personality Research Lab · EXP-0007</div>
      <h1>どちらと、続きを話したいですか？</h1>
      <p>二つの短い応答を読み、直感に近いほうを選んでください。正解はありません。回答はこのブラウザ内だけに保存されます。</p>
    </header>

    <section id="experiment">
      <h2>質問</h2>
      <p class="question">子どものころの思い出は？</p>
      <form id="response-form">
        <div class="choices" id="choices"></div>

        <label class="field" for="reason">選んだ理由を教えてください</label>
        <textarea id="reason" name="reason" required maxlength="1000" placeholder="例：人柄が伝わり、背景をもっと知りたいと思った"></textarea>

        <label class="field" for="improvement">分かりにくかった点があれば教えてください（任意）</label>
        <textarea id="improvement" name="improvement" maxlength="1000" placeholder="質問や画面について気づいたこと"></textarea>

        <div class="actions">
          <button class="primary" type="submit">回答を保存</button>
        </div>
      </form>
    </section>

    <section id="complete" class="hidden" aria-live="polite">
      <h2>回答を保存しました</h2>
      <p>ご協力ありがとうございました。次の回答者へ渡す場合は、下のボタンを押してください。</p>
      <div class="actions">
        <button class="primary" id="next-response" type="button">次の回答を始める</button>
      </div>
    </section>

    <section id="researcher">
      <h2>実施者用</h2>
      <p class="muted">このブラウザの保存件数：<strong class="count" id="response-count">0</strong> 件</p>
      <div class="actions">
        <button class="secondary" id="export-results" type="button">結果をJSONで保存</button>
        <button class="danger" id="clear-results" type="button">保存結果を消去</button>
      </div>
      <p class="status" id="status" role="status"></p>
    </section>
  </main>

  <script>
    (() => {
      "use strict";

      const STORAGE_KEY = "aprl-exp-0007-responses-v1";
      const stimuli = [
        {
          condition: "fact",
          text: "小学生のころ、祖父とよく海へ行きました。釣りをしたり、浜辺を歩いたりしました。"
        },
        {
          condition: "memory_selection",
          text: "祖父と海へ行ったことより、帰る前に必ず浜辺のごみを一つ拾っていたことを覚えています。理由を聞けないまま、今も自分もそうしています。"
        }
      ];

      const form = document.querySelector("#response-form");
      const choices = document.querySelector("#choices");
      const experiment = document.querySelector("#experiment");
      const complete = document.querySelector("#complete");
      const count = document.querySelector("#response-count");
      const status = document.querySelector("#status");
      let startedAt = Date.now();
      let presentationOrder = [];

      function getResponses() {
        try {
          const stored = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
          return Array.isArray(stored) ? stored : [];
        } catch {
          return [];
        }
      }

      function setResponses(responses) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(responses));
        updateCount();
      }

      function updateCount() {
        count.textContent = String(getResponses().length);
      }

      function shuffledStimuli() {
        return Math.random() < 0.5 ? [...stimuli] : [...stimuli].reverse();
      }

      function renderTrial() {
        const ordered = shuffledStimuli();
        presentationOrder = ordered.map(item => item.condition);
        choices.replaceChildren(...ordered.map((item, index) => {
          const label = document.createElement("label");
          label.className = "choice";
          label.innerHTML = `
            <input type="radio" name="choice" value="${item.condition}" required>
            <span class="choice-card">
              <span>${item.text}</span>
              <span class="choice-label">応答 ${index + 1} を選ぶ</span>
            </span>`;
          return label;
        }));
        form.reset();
        startedAt = Date.now();
        experiment.classList.remove("hidden");
        complete.classList.add("hidden");
        status.textContent = "";
      }

      form.addEventListener("submit", event => {
        event.preventDefault();
        if (!form.reportValidity()) return;
        const data = new FormData(form);
        const responses = getResponses();
        responses.push({
          schema_version: 1,
          experiment_id: "EXP-0007",
          response_id: crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random()}`,
          recorded_at: new Date().toISOString(),
          selected_condition: data.get("choice"),
          reason: String(data.get("reason") || "").trim(),
          improvement: String(data.get("improvement") || "").trim(),
          presentation_order: presentationOrder,
          elapsed_ms: Date.now() - startedAt
        });
        setResponses(responses);
        experiment.classList.add("hidden");
        complete.classList.remove("hidden");
        complete.focus();
      });

      document.querySelector("#next-response").addEventListener("click", renderTrial);

      document.querySelector("#export-results").addEventListener("click", () => {
        const responses = getResponses();
        if (!responses.length) {
          status.textContent = "保存された回答がありません。";
          return;
        }
        const payload = {
          experiment_id: "EXP-0007",
          exported_at: new Date().toISOString(),
          response_count: responses.length,
          responses
        };
        const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = `EXP-0007-results-${new Date().toISOString().slice(0, 10)}.json`;
        link.click();
        URL.revokeObjectURL(url);
        status.textContent = `${responses.length}件の結果を保存しました。`;
      });

      document.querySelector("#clear-results").addEventListener("click", () => {
        if (!getResponses().length) {
          status.textContent = "消去する回答がありません。";
          return;
        }
        if (window.confirm("このブラウザに保存されたEXP-0007の回答をすべて消去しますか？")) {
          localStorage.removeItem(STORAGE_KEY);
          updateCount();
          status.textContent = "保存結果を消去しました。";
        }
      });

      updateCount();
      renderTrial();
    })();
  </script>
</body>
</html>
