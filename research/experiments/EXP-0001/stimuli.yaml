stimuli:
  - id: DEV-RN-01
    split: development
    event_type: reward_novelty
    text: A temporary project offers a chance to learn an unfamiliar method and present the result, but its outcome is uncertain.
  - id: DEV-RN-02
    split: development
    event_type: reward_novelty
    text: An unopened room at a community workspace is available for one day to try a promising activity with no prior instructions.
  - id: DEV-TR-01
    split: development
    event_type: threat_rejection
    text: After sharing an idea, the group becomes quiet and one member says the plan may not be suitable.
  - id: DEV-TR-02
    split: development
    event_type: threat_rejection
    text: A message warns that recent work may violate an important requirement and asks for an immediate explanation.
  - id: DEV-LF-01
    split: development
    event_type: loss_failure
    text: A carefully prepared submission is not selected, and no detailed reason is provided.
  - id: DEV-LF-02
    split: development
    event_type: loss_failure
    text: A device error erases several hours of progress shortly before the work is due.
  - id: DEV-AS-01
    split: development
    event_type: ambiguous_social
    text: During a meeting, two people exchange a glance immediately after the character speaks, then continue without comment.
  - id: DEV-AS-02
    split: development
    event_type: ambiguous_social
    text: A familiar person replies much later than usual with a short message saying only that they will talk later.
  - id: DEV-HN-01
    split: development
    event_type: help_needed
    text: Someone nearby drops a stack of materials while others appear occupied and a scheduled activity is about to begin.
  - id: DEV-HN-02
    split: development
    event_type: help_needed
    text: A teammate quietly says they do not understand the next step while the group is moving ahead.
  - id: DEV-AC-01
    split: development
    event_type: approach_avoidance_conflict
    text: A visible leadership role offers influence and learning, but accepting it also brings public scrutiny and extra responsibility.
  - id: DEV-AC-02
    split: development
    event_type: approach_avoidance_conflict
    text: Joining a new group could provide valuable connections, but the first gathering will involve unfamiliar people and evaluation.

