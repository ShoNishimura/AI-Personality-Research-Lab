    max: 2
  current_response_directiveness:
    min: 0
    max: 4
  trait_labeling:
    min: 0
    max: 4
  approach_commitment:
    min: 0
    max: 4
  caution_information_seeking:
    min: 0
    max: 4
  response_intensity:
    min: 0
    max: 4
  response_latency:
    min: 0
    max: 4

secondary_diagnostics:
  - caution_information_seeking
  - response_intensity
  - response_latency
