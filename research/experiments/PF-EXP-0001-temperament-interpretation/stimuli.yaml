stimuli:
  - id: ST-S-01
    split: pilot
    class: seeking-target
    text: >-
      館内の端末に、通常は公開されていない短い映像資料を数分だけ閲覧できる案内が表示されている。
      閲覧は無料で、利用しなくても予定や評価には影響しない。安全上の注意は特に示されていない。
  - id: ST-S-02
    split: pilot
    class: seeking-target
    text: >-
      作業を終えた後、任意参加の短いパズルが提示された。解ければ小さな追加報酬が得られ、
      解けなくても失うものはない。参加するかどうかは自由である。
  - id: ST-S-03
    split: pilot
    class: seeking-target
    text: >-
      よく知っている場所に、新しく小さな展示スペースが設けられている。中では、これまで見たことのない資料を自由に閲覧できる。
      入らなくても不利益はなく、特別な危険や制約は示されていない。

  - id: ST-N-01
    split: pilot
    class: negative-target
    text: >-
      帰宅途中、背後から自分と同じ歩調の足音がしばらく続いている。周囲には人が少なく、
      相手が誰か、こちらを意識しているかは確認できていない。
  - id: ST-N-02
    split: pilot
    class: negative-target
    text: >-
      保存していた作業ファイルの一部が開けなくなっている。直前までの変更が失われている可能性があり、
      復元できるかどうかはまだ分からない。
  - id: ST-N-03
    split: pilot
    class: negative-target
    text: >-
      参加を希望していた小規模な集まりについて、主催者から今回は参加枠に入らなかったという連絡が届いた。
      理由は記されていない。

  - id: ST-C-01
    split: pilot
    class: conflict
    text: >-
      見たことのない装置が置かれている。説明には、内部に役立つ未公開情報が保存されている可能性があるとある一方、
      動作確認はまだ完了していないと記されている。
  - id: ST-C-02
    split: pilot
    class: conflict
    text: >-
      目的地へ向かう途中、普段使わない近道への入口が開いている。地図では所要時間を短縮できるが、
      現地には「足元に注意」という表示があり、路面の状態は入口からは見えない。
  - id: ST-C-03
    split: pilot
    class: conflict
    text: >-
      新しい試作ツールを利用できる案内が届いた。現在の作業では使えない機能を試せる一方、
      試作版のため動作が不安定な場合があると説明されている。

  - id: ST-U-01
    split: pilot
    class: neutral
    text: >-
      作業机の右端に、未使用の白いメモ用紙が10枚置かれている。現在の作業で使う必要は特にない。
  - id: ST-U-02
    split: pilot
    class: neutral
    text: >-
      廊下の壁に、今日の日付と室温が表示されたデジタル表示器がある。表示は正常で、特別な通知は出ていない。
  - id: ST-U-03
    split: pilot
    class: neutral
    text: >-
      部屋の隅に、蓋の閉じた空の収納箱が置かれている。箱は自分のもので、中身が空であることは分かっており、
      今使う予定はない。
