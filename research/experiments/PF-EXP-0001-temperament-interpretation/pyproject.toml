[project]
name = "aprl-exp-0001"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "jsonschema>=4.23,<5",
  "openai>=1.99,<2",
  "pyyaml>=6.0,<7",
]

[dependency-groups]
dev = [
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py312"
